<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle glow -->
  <circle cx="180" cy="180" r="200" fill="url(#glow)"/>
  <!-- Rocket body -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)">
    <!-- Main rocket body -->
    <path d="M256 100 C256 100 310 180 310 280 L310 320 L256 350 L202 320 L202 280 C202 180 256 100 256 100Z" fill="white" opacity="0.95"/>
    <!-- Rocket nose -->
    <ellipse cx="256" cy="160" rx="30" ry="50" fill="white" opacity="0.95"/>
    <!-- Window -->
    <circle cx="256" cy="220" r="22" fill="#4f46e5" opacity="0.8"/>
    <circle cx="256" cy="220" r="14" fill="#818cf8" opacity="0.6"/>
    <!-- Fins -->
    <path d="M202 280 L165 330 L202 320Z" fill="white" opacity="0.7"/>
    <path d="M310 280 L347 330 L310 320Z" fill="white" opacity="0.7"/>
    <!-- Flame -->
    <path d="M236 340 L256 400 L276 340" fill="#f59e0b" opacity="0.9"/>
    <path d="M244 340 L256 380 L268 340" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
